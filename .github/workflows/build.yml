name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '重试发布已有 tag（例如 v1.3.0）；留空仅构建 Debug'
        required: false
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 用工程自带的 wrapper 构建，版本与本地一致（gradle-wrapper.jar 已随仓库提交）
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 打 tag 发版前的硬校验（放在编译之前，几秒内失败，不浪费时间）：
      #   1. 签名 Secrets 缺失就直接失败。以前是静默回退 debug 签名，
      #      发出去的「正式版」装不上任何已装正式版的机器。
      #   2. tag 必须与 versionName 一致。否则应用内更新会陷入死循环：
      #      提示装完新版本，BuildConfig.VERSION_NAME 还是旧的，下次启动又提示。
      - name: Verify release prerequisites
        if: env.RELEASE_TAG != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::tag 构建缺少签名 Secrets:$missing —— 在仓库 Settings → Secrets 补齐后重试发布"
            exit 1
          fi

          version_name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$RELEASE_TAG" != "v$version_name" ]; then
            echo "::error::tag ${RELEASE_TAG} 与 app/build.gradle.kts 的 versionName ${version_name} 不一致"
            exit 1
          fi

      - name: Build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quota-board-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 签名 Secrets 的完整性已在上一步校验过，这里不再做存在性判断
      # （有判断就有静默回退，正是之前那个坑）
      - name: Prepare release signing
        if: env.RELEASE_TAG != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        if: env.RELEASE_TAG != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew lintRelease assembleRelease --no-daemon

      - name: Verify release APK and generate checksum
        if: env.RELEASE_TAG != ''
        working-directory: app/build/outputs/apk/release
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          signing_details="$("$apksigner" verify --verbose --print-certs app-release.apk)"
          printf '%s\n' "$signing_details"
          # 固定已验证的 v1.2.35 正式证书，阻止误用 Debug 或其他密钥导致无法覆盖升级。
          expected_cert='e8b280b0149639be7e371d7d836cb4b2f7cf604bbfce3c628bb58994836fb84b'
          # 不依赖工具版本的前缀：旧版为 Signer #1，新版为 V2 Signer / V3 Signer。
          certificates="$(printf '%s\n' "$signing_details" | sed -n 's/.*certificate SHA-256 digest: //p' | tr -d '\r' | tr 'A-F' 'a-f')"
          if [ -z "$certificates" ] || printf '%s\n' "$certificates" | grep -Fvxq "$expected_cert"; then
            echo "::error::APK 签名与已有正式版不一致，停止发布"
            exit 1
          fi
          sha256sum app-release.apk > app-release.apk.sha256

      - name: Upload release APK
        if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v4
        with:
          name: quota-board-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.sha256
          if-no-files-found: error

      # 用 gh 直接创建 Release 并附加 APK：文件不存在或上传失败会直接让任务失败
      - name: Create GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 用 CHANGELOG 里对应版本的章节作为 Release 说明（应用内更新弹窗直接读它）
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v ver="${RELEASE_TAG#v}" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ {flag=0}
            flag {print}
          ' CHANGELOG.md > "$notes_file"
          if [ -s "$notes_file" ]; then
            gh release create "${RELEASE_TAG}" \
              --title "额度台 ${RELEASE_TAG}" \
              --notes-file "$notes_file" \
              app/build/outputs/apk/release/app-release.apk \
              app/build/outputs/apk/release/app-release.apk.sha256
          else
            gh release create "${RELEASE_TAG}" \
              --title "额度台 ${RELEASE_TAG}" \
              --generate-notes \
              app/build/outputs/apk/release/app-release.apk \
              app/build/outputs/apk/release/app-release.apk.sha256
          fi
          gh release view "${RELEASE_TAG}" --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'
